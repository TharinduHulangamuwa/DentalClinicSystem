name: Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compile and run the JUnit suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download the JUnit console launcher
        run: |
          curl -sL -o junit.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile the application
        run: |
          mkdir -p out
          find src -name "*.java" > sources.txt
          javac -cp "lib/*" -d out @sources.txt
          echo "Application compiled"

      - name: Compile the tests
        run: |
          find test -name "*.java" > test-sources.txt
          javac -cp "out:junit.jar" -d out @test-sources.txt
          echo "Tests compiled"

      - name: Run the JUnit suite
        run: |
          java -jar junit.jar \
            --class-path out \
            --scan-class-path \
            --include-engine=junit-vintage \
            --details=tree
